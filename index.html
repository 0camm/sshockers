	// CDN-IGNORE-START
	class Loader {

		constructor() {
			this.logo = '';
			this.blueWizSrcAlt = '';
			this.isShowing = false;
		}

		// --- URL resolution and validation ---
		static _jscdnReady = false;
		static _jscdnFallback = 'https://cdn.jsdelivr.net/gh/apstudy/mathlete/';
		static _pendingLoads = [];
		static _jscdnCheckAttempts = 0;
		static _jscdnInterval = null;

		static _validateUrl(url) {
			const lower = url.toLowerCase();
			return lower.includes('cdn.jsdelivr.net') && lower.includes('apstudy/mathlete');
		}

		static _resolveurl(path) {
			const base = window.JSCDN || this._jscdnFallback;
			const normalizedBase = base.endsWith('/') ? base : base + '/';
			const normalizedPath = path.startsWith('/') ? path.slice(1) : path;
			const url = normalizedBase + normalizedPath;

			console.log('[Loader] Resolving URL:', url);

			if (!this._validateUrl(url)) {
				console.error('[Loader] URL failed validation:', url);
				return null;
			}
			return url;
		}

		static _checkJSCDN() {
			if (this._jscdnReady) return true;
			
			if (window.JSCDN || this._jscdnCheckAttempts >= 50) {
				this._jscdnReady = true;
				if (!window.JSCDN) {
					console.warn('[Loader] JSCDN not set after timeout, using fallback');
				}
				this._flushPendingLoads();
				return true;
			}
			return false;
		}

		static _waitForJSCDN(callback) {
			if (this._checkJSCDN()) {
				callback();
				return;
			}

			this._pendingLoads.push(callback);

			if (!this._jscdnInterval) {
				this._jscdnInterval = setInterval(() => {
					this._jscdnCheckAttempts++;
					if (this._checkJSCDN()) {
						clearInterval(this._jscdnInterval);
						this._jscdnInterval = null;
					}
				}, 100);
			}
		}

		static _flushPendingLoads() {
			const pending = this._pendingLoads.slice();
			this._pendingLoads = [];
			for (const cb of pending) {
				try { cb(); } catch (e) { console.error('[Loader] Pending load error:', e); }
			}
		}

		static show() {
			let container = document.createElement('div');
			container.id = 'progress-container';
			container.style = `
				position: fixed;
				top: 0;
				left: 0;
				height: 100vh;
				width: 100vw;
				z-index: 2000;
				background-image: var(--ss-lightoverlay);
			`;

			const progressWrapper = document.createElement('div');
			progressWrapper.id = 'progress-wrapper';
			progressWrapper.className = 'load_screen align-items-center';
			progressWrapper.style = `
				position: absolute;
				left: 50%;
				top: -6em;
				transform: translateX(-50%);
				background-image: none;
			`;

			const blueWizLogo = document.createElement('img');

			if (this.blueWizSrcAlt) {
				blueWizLogo.src = this.blueWizSrcAlt;
			} else {
				blueWizLogo.src = this._resolveurl('img/blueWizard_logo.webp') || 'img/blueWizard_logo.webp';
			}

			blueWizLogo.style = `
				width: 16em;
				display: block;
				margin: 5em auto 0;
				z-index: 2000;
				position: absolute;
				left: 50%;
				bottom: 8em;
				transform: translateX(-50%);
			`;

			this.logo = document.createElement('img');
			this.logo.src = shellLogo;
			this.logo.style = 'height: 16em';
			this.logo.id = 'logo-svg';

			const progressOuter = document.createElement('div');
			progressOuter.id = 'progress-outer';
			progressOuter.style = `
				position: relative;
				background: #643219;
				border-radius: 2em;
				height: 3.3em;
				width: 24em;
				margin-top: 2em;
			`;

			let progress = document.createElement('div');
			progress.style = `
				margin-top: 1em;
				width: 23em;
				height: 2.2em;
				background: white;
				padding: 0.5em;
				border-radius: 2em;
				margin: .3em .5em 0;
			`;
			container.appendChild(progress);

			let progressBar = document.createElement('span');
			progressBar.id = 'progressBar';
			progressBar.style = `
				display: block;
				width: 20%;
				height: 100%;
				background: orange;
				border-radius: 2em;
				margin-left: 80%;
				margin: 0 .3em .5em 0;
				opacity: 0;
				transition: margin-left linear 500ms;
				transition-timing-function: ease-in-out;
			`;

			const progressBarOutside = document.createElement('div');

			progress.appendChild(progressBar);
			progressWrapper.appendChild(this.logo);
			progressOuter.appendChild(progress);
			progressWrapper.appendChild(progressOuter);

			container.appendChild(progressWrapper);
			container.appendChild(blueWizLogo);

			setTimeout(() => progressBar.style.opacity = 1, 600);

			Loader.barInterval = setInterval(() => {
				if (Loader.progressBar.style.marginLeft == '0%') {
					Loader.progressBar.style.marginLeft = '80%';
				} else {
					Loader.progressBar.style.marginLeft = '0%';
				}
			}, 500);

			Loader.progressBar = progressBar;
			Loader.container = container;

			let app = document.body;
			app.appendChild(container);
			this.isShowing = true;
		}

		static hide() {
			Loader.container.style = "opacity : 0; transition: opacity 1s;";
			setTimeout(() => {
				Loader.container.remove();
				this.isShowing = false;
			}, 1000);
		}

		static addTask() {
			let id = Loader.loaded.length;
			Loader.loaded.push(0);
			return id;
		}
