<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Fullscreen System</title>

<style>
body {
  margin: 0;
  background: #111;
  color: white;
  font-family: Arial;
}

/* fake game container */
#game {
  width: 100vw;
  height: 100vh;
  background: #222;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* fullscreen button */
#fsBtn {
  position: absolute;
  bottom: 20px;
  right: 20px;
  width: 50px;
  height: 50px;
  background: rgba(0,0,0,0.6);
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: 0.2s;
}

#fsBtn:hover {
  background: rgba(255,255,255,0.2);
}

/* icon */
#fsBtn svg {
  width: 26px;
  height: 26px;
  fill: white;
}

/* active state */
.fullscreen-active #fsBtn {
  background: rgba(255,255,255,0.3);
}
</style>
</head>

<body>

<div id="game">
  GAME HERE

  <!-- fullscreen button -->
  <div id="fsBtn" onclick="toggleFullscreen()">
    <svg viewBox="0 0 24 24">
      <path d="M7 14H5v5h5v-2H7v-3zm12 5v-5h-2v3h-3v2h5zM7 7h3V5H5v5h2V7zm10 3h2V5h-5v2h3v3z"/>
    </svg>
  </div>

</div>

<script>
// ===== CORE FULLSCREEN =====
function enterFullscreen() {
  const el = document.documentElement;

  if (el.requestFullscreen) el.requestFullscreen();
  else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  else if (el.msRequestFullscreen) el.msRequestFullscreen();
}

function exitFullscreen() {
  if (document.exitFullscreen) document.exitFullscreen();
  else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    enterFullscreen();
  } else {
    exitFullscreen();
  }
}

// ===== ALT + ENTER SHORTCUT =====
document.addEventListener("keydown", (e) => {
  if (e.altKey && e.key.toLowerCase() === "enter") {
    e.preventDefault();
    toggleFullscreen();
  }
});

// ===== ESC / STATE DETECTION =====
function updateUI() {
  if (document.fullscreenElement) {
    document.body.classList.add("fullscreen-active");
  } else {
    document.body.classList.remove("fullscreen-active");
  }
}

// listens for ANY fullscreen change (ESC, F11, button, etc)
document.addEventListener("fullscreenchange", updateUI);
document.addEventListener("webkitfullscreenchange", updateUI);

// ===== OPTIONAL: DOUBLE CLICK TO FULLSCREEN =====
document.getElementById("game").addEventListener("dblclick", () => {
  toggleFullscreen();
});
</script>

</body>
</html>
